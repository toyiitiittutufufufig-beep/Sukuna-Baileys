
name: Extract Sukuna Baileys

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o Sukuna-Baileys.zip -d extracted

      - name: Move files to repository root
        run: |
          cp -a extracted/. .
          rm -rf extracted
          rm -f Sukuna-Baileys.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract Sukuna Baileys source"
          git push
          
