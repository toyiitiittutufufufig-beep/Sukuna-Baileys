name: 1 - Wipe repo (keep zip + workflows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show zips found
        run: |
          echo "ملفات الزيب في الجذر:"
          ls -la ./*.zip 2>/dev/null || { echo "❌ مفيش أي ملف .zip في جذر المستودع — ارفعه الأول"; exit 1; }

      - name: Delete everything except .git, .github and *.zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for f in ./*; do
            n="$(basename "$f")"
            case "$n" in .git|.github) continue ;; esac
            case "$n" in *.zip) [ -f "$f" ] && continue ;; esac
            rm -rf -- "$f"
          done
          echo "الباقي:"; ls -la

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "مفيش حاجة اتمسحت."; exit 0; fi
          git commit -m "chore: wipe repo (kept zip + workflows)"
          git push
