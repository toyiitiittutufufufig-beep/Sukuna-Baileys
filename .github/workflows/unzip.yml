
name: Extract Baileys Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o Baileys.zip -d extracted
          find extracted -mindepth 1 -maxdepth 1 -type d

      - name: Move source files to repository root
        run: |
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ZIP structure not recognized"
            exit 1
          fi

          cp -a "$ROOT"/. .

          rm -rf extracted
          rm -f Sukuna-Baileys.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract Baileys source"
          git push
          
